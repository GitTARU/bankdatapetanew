version: "3.8"

services:
  app:
    build: .
    container_name: bankdatapetanew-service
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    env_file: .env
    networks:
      - main
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  main:
    name: main
    external: true
